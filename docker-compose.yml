services:
  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: reachinbox_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: reachinbox_scheduler
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 (BullMQ Queue & Distributed Rate Limiter)
  redis:
    image: redis:7-alpine
    container_name: reachinbox_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Elasticsearch 8 (Full-Text Email Search)
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: reachinbox_elasticsearch
    restart: always
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # Express.js + BullMQ Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reachinbox_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/reachinbox_scheduler?schema=public
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - WORKER_CONCURRENCY=5
      - EMAIL_DELAY_MS=2000
      - MAX_EMAILS_PER_HOUR_PER_SENDER=50
      - MAX_EMAILS_PER_HOUR=200
      - DEFAULT_SENDER_EMAIL=outreach@reachinbox.test
      - DEFAULT_SENDER_NAME=ReachInbox Growth
      - FRONTEND_URL=http://localhost:5173
      # Optional custom SMTP (if empty, Ethereal test account is auto-created)
      - SMTP_HOST=
      - SMTP_PORT=587
      - SMTP_USER=
      - SMTP_PASS=
      # Slack Configuration
      - SLACK_CLIENT_ID=
      - SLACK_CLIENT_SECRET=
      - SLACK_REDIRECT_URI=http://localhost:5000/api/slack/oauth/callback
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  # React Frontend Dashboard
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reachinbox_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  es_data:
